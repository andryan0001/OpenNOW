name: android-apk

# Builds the Android release APK from the `android-native` branch, signs it with the
# project's existing release certificate, and uploads the signed APK as a workflow artifact.
#
# Why a branch checkout: the Android project (`android/`, Gradle wrapper, `nvst/`) is not on
# `main`; commit adeff836 removed it. `android-native` is the branch that still carries it.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    Base64 of the release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD  Keystore password
#   ANDROID_KEY_ALIAS          Key alias inside the keystore
#   ANDROID_KEY_PASSWORD       Key password
# Optional:
#   ANDROID_CERT_SHA256        Expected signing certificate SHA-256. When set, the run fails
#                              if the APK is not signed by that exact certificate.
#
# Create the base64 value with: base64 -w0 release.keystore

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build-signed-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Android sources
        uses: actions/checkout@v4
        with:
          ref: android-native
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Accepts SDK licenses, so AGP can install the build-tools, NDK, and CMake it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/nvst -> target

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without the original keystore the APK cannot keep the existing signature."
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          test -s "${RUNNER_TEMP}/release.keystore"

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${STORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not set}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is not set}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not set}"

          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          zipalign="${build_tools}/zipalign"
          apksigner="${build_tools}/apksigner"

          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="${RUNNER_TEMP}/opennow-aligned.apk"
          signed="${RUNNER_TEMP}/opennow-signed.apk"
          if [ ! -f "${unsigned}" ]; then
            echo "::error::Expected unsigned release APK at ${unsigned}"
            exit 1
          fi

          # The project defines no signingConfig, so AGP emits an unsigned APK.
          # 16 KiB page alignment matches the Rust build's max-page-size=16384 setting.
          "${zipalign}" -P 16 -f 4 "${unsigned}" "${aligned}"
          "${apksigner}" sign \
            --ks "${RUNNER_TEMP}/release.keystore" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "env:STORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "${signed}" "${aligned}"

          mkdir -p dist
          "${apksigner}" verify --verbose --print-certs "${signed}" | tee dist/apk-signature.txt

          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            actual="$("${apksigner}" verify --print-certs "${signed}" | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')"
            expected="$(printf '%s' "${EXPECTED_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::Signing certificate mismatch: expected ${expected}, got ${actual}"
              exit 1
            fi
          fi

      - name: Collect artifact
        id: apk
        run: |
          set -euo pipefail
          version_name="$(grep -m1 -E 'versionName[[:space:]]*=' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$(grep -m1 -E 'versionCode[[:space:]]*=' android/app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          mkdir -p dist
          out="dist/OpenNOW-${version_name}-${version_code}.apk"
          cp "${RUNNER_TEMP}/opennow-signed.apk" "${out}"
          sha256sum "${out}" | tee "${out}.sha256"
          echo "path=${out}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${out}")" >> "${GITHUB_OUTPUT}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
            dist/apk-signature.txt
          if-no-files-found: error
          retention-days: 30
